[package]
name = "aml_graph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Connectome-informed recurrent graph neural network for AML risk prediction: transaction graph -> temporal hypergraph -> recurrent memory -> GNN -> risk"

[lib]
name = "aml_graph"
path = "src/lib.rs"

[[bin]]
name = "aml-gnn"
path = "src/bin/aml_gnn.rs"

[dependencies]
aml_engine = { path = "../aml_engine" }
aml_datasets = { path = "../aml_datasets" }
hcrnn = { package = "human_connectome_rnn", path = "../../vendor/hcrnn" }
anyhow.workspace = true
clap.workspace = true
csv = "1"
serde.workspace = true
serde_json.workspace = true
