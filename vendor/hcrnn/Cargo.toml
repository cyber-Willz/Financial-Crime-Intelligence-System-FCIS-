[package]
name = "human_connectome_rnn"
version = "0.4.0"
edition = "2021"
description = "Vendored from human_connectome_rnn v0.4 (library only): connectome-constrained recurrent wiring, delays and Dale's-law structure"
license = "MIT"

[lib]
name = "hcrnn"
path = "src/lib.rs"

[dependencies]
krylov_ds = { path = "../krylov_ds" }
spectral_hypergraph = { path = "../spectral_hypergraph" }
nbsc = { path = "../nbsc", default-features = false, features = ["hypergraph"] }
nalgebra = "0.32"
