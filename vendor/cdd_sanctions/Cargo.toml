[package]
name = "cdd_sanctions"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Customer Due Diligence tracking and sanctions-list screening engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.31"
csv = "1"
unicode-normalization = "0.1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "1"
spectral_hypergraph = { path = "../spectral_hypergraph" }
nalgebra = { version = "0.32", default-features = false, features = ["std"] }

[lib]
name = "cdd_sanctions"
path = "src/lib.rs"

[[bin]]
name = "cddctl"
path = "src/bin/cddctl.rs"

[profile.release]
opt-level = 3
